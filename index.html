<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор пароля</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 350px;
        }
        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #667eea;
            color: white;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        button:hover {
            background: #5568d3;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            width: 60%;
            text-align: center;
            margin-right: 5px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .check-btn {
            background: #28a745;
        }
        .check-btn:hover {
            background: #218838;
        }
        #result {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            min-height: 24px;
        }
        .success {
            color: #28a745;
        }
        .error {
            color: #dc3545;
        }
        .info {
            color: #666;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Угадай пароль</h1>
        <button id="startBtn">Запустить</button>
        <div id="inputArea" style="display:none;">
            <input type="text" id="passwordInput" maxlength="4" placeholder="0000" inputmode="numeric">
            <button class="check-btn" id="checkBtn">Проверить</button>
        </div>
        <div id="result"></div>
        <div class="info" id="info"></div>
    </div>

    <script>
        let secretPassword = null;
        let attempts = 0;

        const startBtn = document.getElementById('startBtn');
        const checkBtn = document.getElementById('checkBtn');
        const passwordInput = document.getElementById('passwordInput');
        const result = document.getElementById('result');
        const info = document.getElementById('info');
        const inputArea = document.getElementById('inputArea');

        // Генерация 4-значного пароля из цифр (0000-9999)
        function generatePassword() {
            return String(Math.floor(Math.random() * 10000)).padStart(4, '0');
        }

        startBtn.addEventListener('click', () => {
            secretPassword = generatePassword();
            attempts = 0;
            result.textContent = '';
            info.textContent = '';
            inputArea.style.display = 'block';
            passwordInput.value = '';
            passwordInput.focus();
            // Для проверки в консоли (можно удалить)
            console.log('Секретный пароль:', secretPassword);
        });

        checkBtn.addEventListener('click', checkPassword);

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        function checkPassword() {
            if (!secretPassword) {
                result.textContent = 'Сначала нажмите "Запустить"';
                result.className = 'error';
                return;
            }

            const userInput = passwordInput.value.trim();

            if (!/^\d{4}$/.test(userInput)) {
                result.textContent = 'Введите 4 цифры';
                result.className = 'error';
                return;
            }

            attempts++;

            if (userInput === secretPassword) {
                result.textContent = `✅ Вы ввели верный пароль! (попыток: ${attempts})`;
                result.className = 'success';
            } else {
                result.textContent = `❌ Неверный пароль. Попробуйте ещё раз.`;
                result.className = 'error';
                info.textContent = `Попыток: ${attempts}`;
                passwordInput.value = '';
                passwordInput.focus();
            }
        }
    </script>
</body>
</html>
